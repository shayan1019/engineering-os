[package]
name = "eos"
version = "0.2.6"
edition = "2021"
description = "Engineering OS CLI: install, workspace, host adapters, gate and evidence"
license = "Apache-2.0"
repository = "https://github.com/shayan1019/engineering-os"
homepage = "https://github.com/shayan1019/engineering-os"
publish = false

[[bin]]
name = "eos"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
